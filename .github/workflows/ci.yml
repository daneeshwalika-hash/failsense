# Continuous integration: lint, format check and tests on a clean checkout.
#
# No raw data and no mlflow.db exist here (both are git-ignored), so every test
# must run on fixtures only - CI is the proof that they do.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned to a commit (the action's README recommends it); v10.3.3.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv reads .python-version (3.12) and installs that interpreter.
      # --locked: fail if uv.lock is out of date with pyproject.toml, instead of
      # silently re-resolving; CI must test exactly the locked versions.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests with coverage
        run: uv run pytest -q --cov --cov-report=term

  # The API image must build from a clean checkout and import its heavy dependencies
  # (libgomp1 for LightGBM/XGBoost, the app itself). The model is not part of the image.
  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build -t failsense-api:ci .

      - name: Build the dashboard image and validate the compose file
        run: |
          docker build --target dashboard -t failsense-dashboard:ci .
          docker run --rm failsense-dashboard:ci \
            python -c "import streamlit, failsense.dashboard.client; print('dashboard ok')"
          docker compose config -q

      - name: Smoke test (imports as the non-root user)
        run: |
          docker run --rm failsense-api:ci \
            python -c "import lightgbm, xgboost, mlflow, shap; from failsense.api.main import app; print('ok', app.title)"
          docker run --rm failsense-api:ci id -u | grep -qx 10001
