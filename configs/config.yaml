# Central configuration for FailSense. No hardcoded paths in the code.
paths:
  raw_data: data/raw
  processed_data: data/processed
  reports: reports

datasets:
  # SCANIA Component X (real truck fleet data, main dataset).
  # Source: SND / researchdata.se, Version 3 (2025-04-09), https://doi.org/10.5878/bnh5-ka77, licence CC BY 4.0
  # (Version 2, https://doi.org/10.5878/jvb5-d390, has the same CSV files). Manual download, see
  # scripts/download_data.sh
  scania:
    dir: data/raw/scania
    # Parquet copies of the CSV files below (make parquet). Raw CSV files stay unchanged.
    processed_dir: data/processed/scania
    train:
      readouts: data/raw/scania/train_operational_readouts.csv
      specifications: data/raw/scania/train_specifications.csv
      tte: data/raw/scania/train_tte.csv
    validation:
      readouts: data/raw/scania/validation_operational_readouts.csv
      specifications: data/raw/scania/validation_specifications.csv
      labels: data/raw/scania/validation_labels.csv
    test:
      readouts: data/raw/scania/test_operational_readouts.csv
      specifications: data/raw/scania/test_specifications.csv
      labels: data/raw/scania/test_labels.csv

  # NASA C-MAPSS FD001 (simulation, RUL regression).
  cmapss:
    dir: data/raw/cmapss
    train: data/raw/cmapss/train_FD001.txt
    test: data/raw/cmapss/test_FD001.txt
    rul: data/raw/cmapss/RUL_FD001.txt

seed: 42

labels:
  # IDA 2024 proximity classes, upper bound inclusive:
  # class k if d <= class_bounds[k-1]; class 0 if d > class_bounds[0].
  # class_bounds[0] is also the horizon of the binary label (Q1).
  class_bounds: [48, 24, 12, 6]

sampling:
  # Random cut-offs per truck in the training split (imitates the truncated
  # histories of validation/test). null = keep all known readouts.
  # Decided 28.10 with failsense.models.compare_cutoffs (LogReg, fixed
  # evaluation = 1 cut-off per truck, same folds): val PR-AUC k=1 0.1001,
  # k=5 0.1051, all 0.1073. k=5 keeps almost all of the gain at 1/13 of the
  # training time of k=all. Re-check with the best model on 05.11.
  n_cutoffs_per_vehicle: 5
  seed: 42

cv:
  # StratifiedGroupKFold by vehicle_id inside the training split.
  # Every model uses the same folds (same seed) for a fair comparison.
  n_splits: 5
  seed: 42

features:
  # Share of the highest bins that counts as the "top-bin share" of a histogram:
  # n_top = max(1, round(top_fraction * n_bins)) per histogram. A fraction (not
  # a fixed count) so the feature means the same for 10 and 36 bins.
  # Starting value 0.2, not tuned; change it only with a paired comparison.
  top_fraction: 0.2

rul:
  # RUL cap for C-MAPSS (cycles). In the first part of an engine's life the sensors show
  # no degradation, so "300 cycles left" and "200 cycles left" look identical; asking a
  # model to tell them apart only adds noise. 125 is the value commonly used for FD001
  # (a convention, not a measurement): RUL = min(max_cycle - cycle, cap).
  cap: 125
  mlflow_experiment: failsense-rul
  # Step 11.11: trailing rolling windows (in cycles) for the mean and std of every informative sensor.
  rolling_windows: [5, 15]
  ridge_alpha: 1.0            # as in docs/results.md section 8 (alphas 0.1 ... 100 tie)
  lightgbm:                   # not tuned: modest, regularised settings for ~100 engines
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 15
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0

tuning:
  # Hyperparameter search (step 7b, 05.11): Optuna TPE, seeded, MedianPruner per fold.
  # The objective is the mean PR-AUC over the 5 folds on the calibrated validation-like
  # evaluation set. Early stopping runs inside every fold on a truck-grouped inner split of
  # the TRAINING trucks, never on the evaluation rows.
  n_trials: 40              # per model (XGBoost and LightGBM are tuned separately)
  timeout_minutes: 12       # hard cap per model (the number of finished trials is logged)
  early_stopping_rounds: 50
  max_rounds: 2000          # upper limit of boosting rounds (early stopping picks the number)
  inner_val_fraction: 0.15  # share of the training trucks used for early stopping
  seed: 42
  top_fraction: 0.05        # alert the 5 % riskiest trucks (provisional metrics, no cost yet)
  storage: optuna_q1.db     # SQLite file (git-ignored); a re-run resumes the study
  registered_model: failsense-q1
  alias: candidate

mlflow:
  # Local tracking: one SQLite file + one artifact folder in the repo root
  # (both git-ignored). Paths are relative to the repo root; failsense.tracking
  # turns them into absolute URIs, so every script writes to the same database
  # no matter from which directory it is started.
  db_path: mlflow.db
  artifact_dir: mlartifacts
  experiment: failsense-q1-binary

cost:
  # SCANIA IDA 2024 misclassification cost matrix (challenge description
  # data/raw/scania/2024_IDA_challenge_v2.pdf, Table 1). Rows = TRUE class 0..4,
  # columns = PREDICTED class 0..4. Cost_0_m = unnecessary workshop check,
  # Cost_n_0 = missed (or too late) failure. Added to the config on 06.11 (the
  # 05.11 session note wrongly said it was already there).
  matrix:
    - [0, 7, 8, 9, 10]
    - [200, 0, 7, 8, 9]
    - [300, 200, 0, 7, 8]
    - [400, 300, 200, 0, 7]
    - [500, 400, 300, 200, 0]
  binary:
    # Q1 has only "alert / no alert", so an alert is mapped to ONE predicted class.
    # Primary mapping ("primary"): a false alarm costs Cost_0_<alert_class>, a missed
    # truck of class k costs Cost_k_0, and an alert on any truck of class 1-4 costs 0
    # (the question is "repair within 48 steps", urgency is not asked).
    # Sensitivity mapping ("literal"): an alert is exactly "predicted class alert_class",
    # so an alerted truck of class k costs Cost_k_<alert_class> (e.g. 400 for class 4).
    alert_class: 1

calibration:
  # Step 06.11: probability calibration and the cost-based alert threshold, evaluated on the
  # OFFICIAL validation split (the test split stays untouched).
  n_splits: 5              # cross-fitting folds (calibrator on validation, threshold choice)
  seed: 42
  primary: sigmoid         # variant used for the headline numbers; fixed BEFORE the run
  n_bins: 10               # quantile bins of the reliability curve
  zoom_max: 0.1            # right edge of the low-probability zoom panel
  top_fraction: 0.05       # baseline "alert the riskiest 5 %"
  n_bootstrap: 500         # bootstrap resamples (trucks) for the PR-AUC interval
  log_loss_eps: 1.0e-6     # probabilities are clipped to [eps, 1 - eps] for the log loss

explain:
  # Step 06.11 (SHAP + permutation importance) on the official validation (5,046 last readouts).
  n_repeats: 20            # shuffles per column / group for the permutation importance
  seed: 42
  top_k: 5                 # factors per truck in the explanations
  story_k: 8               # factors shown in the two waterfall stories
  max_display: 20          # features in the beeswarm / bar plots
  waterfall_display: 12
  top_groups: 5            # groups compared between permutation and SHAP

api:
  # Prediction API (step 07-09.11, `scripts/serve.sh`). The model is NOT named here: the
  # service loads models:/<tuning.registered_model>@<tuning.alias> through the MLflow
  # settings above, so there is one place to change when the alias moves.
  # At startup the service checks that this model URI equals the one in the summary file;
  # it refuses to start otherwise (a calibrator belongs to exactly one model).
  summary_path: reports/calibration_q1_summary.json   # file with the deployment_choice block
  summary_key: deployment_choice   # holds calibrator (sigmoid slope/intercept) and threshold
  host: 127.0.0.1
  port: 8000
  # DuckDB file with one row per /predict (git-ignored). null disables the log.
  prediction_log: logs/predictions.duckdb

unsupervised:
  # Step 09.11: PCA map and KMeans on the TRAINING trucks (one row per truck, last readout).
  # Labels are used only to colour the map and to cross-tabulate clusters.
  variance_kept: 0.90          # PCA components kept for KMeans: smallest number with >= 90 %
  ks: [2, 3, 4, 5, 6, 8, 10]   # numbers of clusters to compare
  silhouette_sample_size: 5000 # silhouette on a random subsample (full O(n^2) is too slow)
  mlflow_experiment: failsense-unsupervised

dashboard:
  # Streamlit dashboard (`make dashboard`). It only talks to the API over HTTP and never loads
  # the model. FAILSENSE_API_URL (environment) overrides api_url, e.g. http://api:8000 in compose.
  api_url: http://127.0.0.1:8000
  timeout_seconds: 10
  # Demo trucks come from the OFFICIAL VALIDATION split (never the test split): a fixed random
  # sample of trucks so the page loads fast.
  n_demo_trucks: 200
  seed: 42
  history_readouts: 15   # how many of the latest readouts are scored for the risk trajectory
  latest_rows: 15        # rows of the 'latest predictions' table (from the API's log)
  refresh_seconds: 5     # how often that table refreshes itself
  report_timeout_seconds: 180  # the German report may take minutes on a CPU-only LLM

q2:
  # Q2 (classes 0-4), ADR 0004. Class counts of the official validation split as published in the
  # dataset paper (Kharazian et al., 2025): classes 0..4. An aggregate number, used only for the
  # prior-shift correction, never to fit or tune anything. The test counts are not used.
  target_class_counts: [4910, 16, 14, 30, 76]
  n_bootstrap: 500
  mlflow_experiment: failsense-q2-classes

anomaly:
  # Step 10.11 / Q4 (ADR 0005): detectors fitted on HEALTHY training trucks only (never repaired,
  # k5 cut-offs); repair labels only evaluate the scores. Scored on the official validation.
  n_estimators: 300        # IsolationForest trees
  max_samples: 256         # rows per tree (the IsolationForest default; keeps training fast)
  pca_components: 50       # PCA before the distance-based LOF (the 90 % of variance, section 10)
  lof_neighbors: 35
  lof_max_rows: 20000      # LOF is O(n^2): fit on a seeded subsample of the healthy rows
  top_fraction: 0.05       # alert the 5 % most anomalous trucks (recall in the top-k)
  n_bootstrap: 500         # bootstrap resamples of the validation trucks (seed 42)
  cross_fit_splits: 5      # the anomaly feature of the training rows is cross-fitted by truck
  n_seeds: 3               # supervised fits per variant (probabilities are averaged)
  mlflow_experiment: failsense-anomaly

llm:
  # Step 13.11: German maintenance report from the prediction + top SHAP factors, via a local LLM
  # (Ollama). enabled: false -> the deterministic template report only. The report is validated
  # (JSON schema, grounded in the given factors, German); invalid or missing LLM -> template report.
  enabled: true
  base_url: http://127.0.0.1:11434
  model: qwen2.5:7b        # ~4.7 GB; `ollama pull qwen2.5:7b`
  timeout_seconds: 120     # CPU-only inference can take a minute or more
  temperature: 0.0
  seed: 42
  max_attempts: 2
  prompt_path: prompts/maintenance_report_de.md

retrain:
  # Champion / challenger (ADR 0007, `make retrain`). Both RECIPES are refitted on the training trucks
  # outside a FIXED holdout (the trucks of one fold of the project's CV, 20 %) and judged on the
  # validation-like evaluation rows of the holdout trucks by the total cost of the Q1 cost-optimal
  # alert decision (threshold cross-fitted by truck, so no truck decides its own threshold).
  holdout_fold: 0
  n_bootstrap: 500            # resamples of the holdout evaluation rows (paired, seed = seed)
  challenger_file: reports/hpo_q1_best_params.json   # Optuna result of make tune
  challenger_model: xgboost
  mlflow_experiment: failsense-retrain

freeze:
  # One frozen evaluation on the test splits (docs/test_evaluation_plan.md). `make freeze` trains the
  # Q2 and RUL models on TRAINING data only, copies the Q1 model and writes a manifest with SHA-256
  # hashes. The frozen files stay in the git-ignored folder; the manifest is committed.
  dir: artifacts/frozen
  manifest: reports/frozen_manifest.json
