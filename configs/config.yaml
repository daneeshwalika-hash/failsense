# Central configuration for FailSense. No hardcoded paths in the code.
paths:
  raw_data: data/raw
  processed_data: data/processed
  reports: reports

datasets:
  # SCANIA Component X (real truck fleet data, main dataset).
  # Source: https://doi.org/10.5878/jvb5-d390 - manual download, see scripts/download_data.sh
  scania:
    dir: data/raw/scania
    # Parquet copies of the CSV files below (make parquet). Raw CSV files stay unchanged.
    processed_dir: data/processed/scania
    train:
      readouts: data/raw/scania/train_operational_readouts.csv
      specifications: data/raw/scania/train_specifications.csv
      tte: data/raw/scania/train_tte.csv
    validation:
      readouts: data/raw/scania/validation_operational_readouts.csv
      specifications: data/raw/scania/validation_specifications.csv
      labels: data/raw/scania/validation_labels.csv
    test:
      readouts: data/raw/scania/test_operational_readouts.csv
      specifications: data/raw/scania/test_specifications.csv
      labels: data/raw/scania/test_labels.csv

  # NASA C-MAPSS FD001 (simulation, RUL regression).
  cmapss:
    dir: data/raw/cmapss
    train: data/raw/cmapss/train_FD001.txt
    test: data/raw/cmapss/test_FD001.txt
    rul: data/raw/cmapss/RUL_FD001.txt

seed: 42

labels:
  # IDA 2024 proximity classes, upper bound inclusive:
  # class k if d <= class_bounds[k-1]; class 0 if d > class_bounds[0].
  # class_bounds[0] is also the horizon of the binary label (Q1).
  class_bounds: [48, 24, 12, 6]

sampling:
  # Random cut-offs per truck in the training split (imitates the truncated
  # histories of validation/test). null = keep all known readouts.
  # The value is chosen with cross validation on 28.10 (compare 1, 5, null).
  n_cutoffs_per_vehicle: 5
  seed: 42
