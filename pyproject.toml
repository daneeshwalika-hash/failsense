[project]
name = "failsense"
version = "0.1.0"
description = "End-to-end predictive maintenance system: failure prediction, RUL, anomaly detection and explainability."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "imbalanced-learn>=0.14.2",
    # LightGBM needs the system OpenMP runtime (apt: libgomp1). It is missing on a fresh
    # WSL Ubuntu and in python:*-slim Docker images, so the Docker image must install it.
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "pandera[pandas]>=0.35.0",
    "pyarrow>=18",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    # xgboost-cpu = the CPU-only build of XGBoost: the same `import xgboost`, but no NVIDIA/NCCL
    # packages (the plain `xgboost` wheel pulls nvidia-nccl-cu13 on Linux). Much smaller, which
    # matters for the Docker image; this project has no GPU.
    "shap>=0.54.1",
    "uvicorn>=0.54.0",
    "xgboost-cpu>=3.4.1",
]

# FailSense is an application, not a published package. The build backend is only
# used by `uv sync` to install src/failsense into .venv as an editable package, so
# notebooks, scripts, `make` targets, tests and Docker can `import failsense`.
# See docs/adr/0002-install-package-with-uv-build.md.
[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    # Run only these with `uv run pytest -m leakage` (or `make leakage`). They check the
    # data-leakage rules of CLAUDE.md section 5; see tests/test_leakage.py.
    "leakage: tests that protect against data leakage (splits, future information, labels as features)",
]
filterwarnings = [
    # Third-party: mlflow's own SQLAlchemy store uses the deprecated `noload` loader
    # (seen in test_learning_curve). Nothing we can fix in this repo; remove the
    # entry when an mlflow update stops emitting it.
    "ignore:The ``noload`` loader strategy is deprecated:sqlalchemy.exc.SADeprecationWarning",
    # Third-party: mlflow's signature inference when logging a model (test_train).
    # Pandas4Warning comes from mlflow/models/utils.py; the integer-column hint is
    # about the integer class labels of predict(). Not our code; remove on an mlflow update.
    "ignore:Operation with range is deprecated:pandas.errors.Pandas4Warning",
    "ignore:Hint. Inferred schema contains integer column:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: isort, B: bugbear, UP: pyupgrade,
# N: naming, SIM: simplify, T20: forbid print (we use logging)
select = ["E", "F", "I", "B", "UP", "N", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["T20"]

[tool.uv]
# `uv sync` (local, CI) installs dev AND dashboard. The API image must not contain Streamlit:
# the Dockerfile uses --no-default-groups.
default-groups = ["dev", "dashboard"]

[dependency-groups]
dashboard = [
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]
dev = [
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
